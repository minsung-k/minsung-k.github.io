{% assign news_items = site.news | sort: "date" | reverse | slice: 0, include.limit -%}

<div class="my-3 bg-white shadow-sm rounded-xl">
    <h4 class="p-3 mb-0 font-weight-normal border-bottom border-gray">News</h4>
    <div class="px-3 py-2">
        {% for item in news_items %}
        <div class="d-flex py-2">
            <div class="font-weight-bold no-break mr-3" style="min-width: 5.5em;">{% if item.date_text %}{{ item.date_text }}{% else %}{{ item.date | date: "%b. %Y" }}{% endif %}</div>
            <div>{{ item.emoji }} {{ item.text }}</div>
        </div>
        {% endfor %}
    </div>
</div>
