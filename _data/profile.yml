short_bio: >-
  <p>
    Hi! My name is Minsung. I am a Ph.D. candidate in the
    <a href="https://www.engr.uga.edu/" target="_blank">Department of Mechanical Engineering</a> at the
    <a href="https://www.uga.edu/" target="_blank">University of Georgia</a>, advised by Hongyue Sun.
    My research asks what an AI model needs beyond accuracy before people can trust it.
  </p>
  <p class="mb-2">I am particularly interested in two areas:</p>
  <ul class="mb-3 pl-4">
    <li class="mb-2">
      <strong>Trustworthy AI for manufacturing:</strong>
      models that protect privacy, work fairly across groups of workers, and are transparent about their uncertainty.
    </li>
    <li>
      <strong>Human-AI interaction:</strong>
      how people and AI read each other, and how they decide together when their judgments conflict.
    </li>
  </ul>



