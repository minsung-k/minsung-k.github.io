short_bio: >-
  <p>
    Hi! My name is Minsung. I am a Ph.D. candidate in the
    <a href="https://www.engr.uga.edu/" target="_blank">Department of Mechanical Engineering</a> at the
    <a href="https://www.uga.edu/" target="_blank">University of Georgia</a>, advised by Hongyue Sun.
    I study <strong>physics-informed and operator learning</strong> and <strong>uncertainty-aware deep learning</strong>,
    with applications to manufacturing and industrial data analytics. I am particularly interested in
    (i) neural operators for predicting complex physical processes such as droplet evolution, and
    (ii) trustworthy and ethical AI for manufacturing systems.
    My work has received a Best Paper Award at the 2026 IISE QCRE Best Track Paper Competition.
  </p>
  <p class="mb-2">
    <mark><strong>I am currently on the job market</strong> (expected graduation: July 2027), looking for <strong>faculty positions</strong>.</mark>
  </p>
  <p>
    Previously, I received my M.S. in Industrial and Systems Engineering from the University of Florida,
    advised by Xiaochen Xian, and my B.B.A. in Management Information Systems from Hankuk University of Foreign Studies.
  </p>
